# Every push and pull request: the build (with and without the screen reader), the
# unit tests, and the simulated users in their sandbox, with the tools the previews,
# conversions and archives use installed as a desktop would have them.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap ffmpeg imagemagick exiv2 poppler-utils \
            p7zip-full zip libarchive-tools sqlite3 woff2 dbus libglib2.0-bin fontconfig ffmpegthumbnailer
          # Thumbnailers a desktop has: music covers (no Ubuntu package installs one alone)
          # and PDFs (evince's is held to AppArmor's paths, which the sandbox is not on).
          printf '#!/bin/sh\npdftoppm -png -singlefile -scale-to "$1" "$2" "$3.p" && mv "$3.p.png" "$3"\n' | sudo tee /usr/local/bin/pdf-thumbnail >/dev/null
          sudo chmod +x /usr/local/bin/pdf-thumbnail
          printf '[Thumbnailer Entry]\nTryExec=pdf-thumbnail\nExec=pdf-thumbnail %%s %%i %%o\nMimeType=application/pdf;\n' | sudo tee /usr/share/thumbnailers/pdf.thumbnailer >/dev/null
          printf '[Thumbnailer Entry]\nTryExec=ffmpeg\nExec=ffmpeg -loglevel quiet -y -i %%i -an -frames:v 1 -vf scale=%%s:-2 -f image2 -c:v png %%o\nMimeType=audio/mpeg;audio/flac;audio/ogg;audio/mp4;\n' \
            | sudo tee /usr/share/thumbnailers/ffmpeg-audio.thumbnailer >/dev/null
          # Ubuntu's ImageMagick 6 has no magick command; the app and tests call it so.
          if ! command -v magick; then
            printf '#!/bin/sh\nexec convert "$@"\n' | sudo tee /usr/local/bin/magick >/dev/null
            sudo chmod +x /usr/local/bin/magick
          fi
          git config --global user.name CI
          git config --global user.email ci@example.invalid
      - name: Build
        run: |
          cargo build --locked
          cargo check --locked --features screen-reader
      - name: Unit tests
        run: cargo test --locked --features testkit -- --skip "sim::"
      - name: Simulated users
        run: |
          # Ubuntu 24.04 keeps unprivileged namespaces, which bwrap needs, behind AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          tools/sim.sh "sim::"
