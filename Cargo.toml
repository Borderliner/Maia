[package]
name = "maia"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"

[dependencies]
# egui draws its text with it already; fonts previewed in the inspector use the same.
ab_glyph = "=0.2.32"
arboard = { version = "3.6.1", default-features = false }
dirs = "7.0.0"
fdeflate = "=0.3.7"
egui = { version = "=0.33.3", default-features = false }
egui-winit = { version = "=0.33.3", default-features = false, features = ["wayland", "x11"] }
egui_glow = { version = "=0.33.3", default-features = false, features = ["winit", "wayland", "x11"] }
gif = "=0.13.3"
glutin = { version = "0.32.3", default-features = false, features = ["egl", "glx", "x11", "wayland"] }
glutin-winit = { version = "0.5.0", default-features = false, features = ["egl", "glx", "x11", "wayland"] }
image-webp = "0.2.4"
libc = "0.2.190"
png = "=0.17.16"
regex-lite = "0.1.9"
saphyr-parser = "=0.2.2"
sctk = { version = "=0.19.2", package = "smithay-client-toolkit", default-features = false, features = ["calloop"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "x11"] }
zune-jpeg = "=0.4.21"

[features]
# Test-only input driver (see src/testkit.rs).
testkit = []

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[profile.bloat]
inherits = "release"
strip = false
debug = false

# User simulations (tools/sim.sh): optimized like a release build so frame timings
# mean something, but quick to build and with overflow checks on.
[profile.sim]
inherits = "dev"
opt-level = 3
overflow-checks = true
debug = 1
